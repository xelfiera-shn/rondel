name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. English or Turkish is fine — Türkçe yazabilirsiniz.
  - type: input
    id: version
    attributes:
      label: Rondel version
      description: Shown at the bottom of the Settings window.
      placeholder: "0.17.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version
      description: On Windows, run `winver`; on macOS, Apple menu → About This Mac.
      placeholder: Windows 11 24H2, build 26100.2314 / macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Empty area of the desktop
        - Folder or file on the desktop
        - Empty area of a folder window (File Explorer or Finder)
        - Folder or file in a folder window
        - Keyboard shortcut
        - Quick Conversation or Ask About a Screenshot
        - Notifications, Active Agents or the agents card
        - Sessions window
        - Updates
        - Settings window, tray icon or menu bar icon
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: The steps you took, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: |
        Settings → turn on **Debug logging**, reproduce the problem, then open the log folder and paste the relevant lines: tray icon → **Open log folder** on Windows, `~/Library/Logs/Rondel` on macOS.
        Remove any paths you do not want to share.
      render: text
  - type: textarea
    id: probe
    attributes:
      label: Probe output
      description: |
        If the menu does not open or uses the wrong folder: run `Rondel.exe --probe X Y result.txt` with the screen coordinates of the spot (on macOS `open -n -W /Applications/Rondel.app --args --probe X Y ~/result.txt`, in points) and paste `result.txt`.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Anything else
      description: Screenshots, terminal (Windows Terminal, console, Terminal or iTerm2), shell (PowerShell version, zsh), agent command or alias, monitor and scaling setup…
