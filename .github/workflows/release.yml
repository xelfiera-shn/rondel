name: Release

# Every push to prod (a merge from dev or a hotfix) publishes a release when the commits since the
# last version contain a feature, a fix, a performance change or a breaking change.
# A manual run is always a dry run: it computes the version and builds, but publishes nothing.
on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF_VERSION: 2.14.2
  GIT_CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      releasable: ${{ steps.version.outputs.releasable }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive"
          echo "$PWD/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Decide the version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range="${last:+$last..}HEAD"
          if git log --format='%s%n%b' "$range" | grep -qE '^(feat|fix|perf)(\([a-z0-9-]+\))?!?: |^[a-z]+(\([a-z0-9-]+\))?!: |^BREAKING[ -]CHANGE: '; then
            tag=$(git-cliff --bumped-version)
            git-cliff --unreleased --tag "$tag" --strip all > notes.md
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Next version: ${tag} (previous: ${last:-none})" >> "$GITHUB_STEP_SUMMARY"
            cat notes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "No feature, fix or breaking change since ${last:-the beginning}: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The files the jobs hand on to the release job are needed only during this run; the release keeps its own copies.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.releasable == 'true'
        with:
          name: release-notes
          path: notes.md
          retention-days: 1

  build:
    name: Build ${{ matrix.runtime }}
    needs: version
    if: needs.version.outputs.releasable == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rondel-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/Rondel.exe
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build ${{ matrix.runtime }}
    needs: version
    if: needs.version.outputs.releasable == 'true'
    # Apple Silicon; the Intel app is cross-compiled.
    runs-on: macos-latest
    # The signing certificate is a secret of the "release" environment, like the release key.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' && 'release' || '' }}
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Built and signed ad hoc first: dotnet publish runs the build code of every package, and the release
      # certificate must not be in reach while it does.
      - name: Publish
        run: ./build/publish-macos.sh --runtime ${{ matrix.runtime }} --version "$VERSION" --identity -

      # macOS ties the Accessibility and Automation permissions to the signing certificate, so every release is
      # signed with the same self-signed one (CONTRIBUTING.md, "The macOS signing certificate"). Its key goes into a
      # keychain of this step only, as non-extractable (-x): it can sign, but not be exported. A dry run, without the
      # environment, keeps the ad hoc signature; a release without the certificate fails.
      - name: Sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::The release environment has no MACOS_CERTIFICATE secret; a release must be signed with it."
              exit 1
            fi
            echo "::warning::No MACOS_CERTIFICATE secret: this dry run keeps the ad hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -x
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          ./build/publish-macos.sh --runtime ${{ matrix.runtime }} --identity "Rondel Release" --sign-only
          security delete-keychain "$keychain"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true

      # ditto keeps the bundle's symbolic links and signature intact, which zip does not.
      - name: Zip
        run: ditto -c -k --keepParent "dist/${{ matrix.runtime }}/Rondel.app" "dist/Rondel-${VERSION}-${{ matrix.runtime }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rondel-${{ matrix.runtime }}
          path: dist/Rondel-${{ needs.version.outputs.version }}-${{ matrix.runtime }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [version, build, build-macos]
    runs-on: ubuntu-latest
    # The release key is a secret of the "release" environment, which only the prod branch may use. A dry run
    # publishes nothing and signs nothing, so it runs without the environment.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/Rondel.Core/Updates/release-key.pem
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare the files
        run: |
          mkdir release
          for runtime in win-x64 win-arm64; do
            cp "artifacts/rondel-${runtime}/Rondel.exe" "release/Rondel-${VERSION}-${runtime}.exe"
          done
          for runtime in osx-arm64 osx-x64; do
            cp "artifacts/rondel-${runtime}/Rondel-${VERSION}-${runtime}.zip" release/
          done
          (cd release && sha256sum *.exe *.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # Rondel takes an update only when SHA256SUMS.txt carries this signature; the app holds the public half
      # (src/Rondel.Core/Updates/release-key.pem). A release without it is not published.
      - name: Sign the checksums
        if: env.PUBLISH == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The release environment has no RELEASE_SIGNING_KEY secret"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl dgst -sha256 -sign "$key" -out release/SHA256SUMS.txt.sig release/SHA256SUMS.txt
          rm -f "$key"
          openssl dgst -sha256 -verify src/Rondel.Core/Updates/release-key.pem -signature release/SHA256SUMS.txt.sig release/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: |
            release/*.exe
            release/*.zip

      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rondel ${VERSION}" \
            --notes-file artifacts/release-notes/notes.md

      # Until 1.0, only the two newest releases stay on GitHub: the new one, and the one before it to go back to. Their
      # tags stay (the next version is computed from them), and CHANGELOG.md keeps the notes of every version.
      - name: Remove older releases
        if: env.PUBLISH == 'true' && startsWith(env.VERSION, '0.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | reverse | .[2:] | .[]' |
          while read -r tag; do
            echo "Removing the release ${tag}; its tag stays"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done

  changelog:
    name: Prepare the changelog
    needs: [version, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive"
          echo "$PWD/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      # CHANGELOG.md is written from the version tags, so it holds every version, also those whose release is gone.
      # It goes to dev through a pull request. GitHub Actions may not open pull requests in this repository (the same
      # setting would let workflows approve them), so this pushes a branch and a maintainer opens the pull request.
      - name: Write CHANGELOG.md on a branch
        run: |
          {
            printf '# Changelog\n\n'
            printf 'Every version of Rondel, newest first. Until 1.0 only the two newest [releases](https://github.com/%s/releases) are kept for download; the notes of all versions are here.\n' "$GITHUB_REPOSITORY"
            git-cliff --body-file build/changelog-body.tera --strip all
          } > "$RUNNER_TEMP/CHANGELOG.md"
          git fetch origin dev
          git switch -c "changelog/v${VERSION}" origin/dev
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update the changelog for ${VERSION}"
          git push origin "changelog/v${VERSION}"
          echo "CHANGELOG.md for ${VERSION} is on the branch changelog/v${VERSION}: [open the pull request](https://github.com/${GITHUB_REPOSITORY}/compare/dev...changelog/v${VERSION}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
