# git-cliff configuration: computes the next version and writes the release notes from
# Conventional Commits (see CONTRIBUTING.md, "Versions and releases").

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  # Releases contain only the Windows app: the macOS app's commits stay out of their notes until it ships.
  { message = "^[a-z]+\\(macos\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]

[bump]
# Below 1.0 a feature raises the minor version and a breaking change does too (not the major).
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
